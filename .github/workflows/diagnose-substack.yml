name: Diagnose Substack access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Check public Substack endpoints
        run: |
          set -u
          feed='https://ktinega.substack.com/feed'
          browser_ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          printf 'Feed, curl default: '
          curl -sSL --max-time 15 -o /dev/null -w '%{http_code} %{content_type}\n' "$feed"
          printf 'Feed, browser user agent: '
          curl -sSL --max-time 15 -A "$browser_ua" -o /dev/null -w '%{http_code} %{content_type}\n' "$feed"
          printf 'Feed, RSS reader user agent: '
          curl -sSL --max-time 15 -A 'Feedly/1.0 (+https://feedly.com)' -o /dev/null -w '%{http_code} %{content_type}\n' "$feed"
          printf 'Archive, curl default: '
          curl -sSL --max-time 15 -o /dev/null -w '%{http_code} %{content_type}\n' 'https://ktinega.substack.com/archive'
          printf 'Posts API, curl default: '
          curl -sSL --max-time 15 -o /dev/null -w '%{http_code} %{content_type}\n' 'https://ktinega.substack.com/api/v1/posts?limit=1'
          printf 'Public profile, curl default: '
          curl -sSL --max-time 15 -o /dev/null -w '%{http_code} %{content_type}\n' 'https://substack.com/@ktinega'
